name: Publiceer De Boekenbalie

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7
      - name: Node instellen
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Afhankelijkheden installeren
        run: npm ci
      - name: Game bouwen
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDVukeqkwHAZuHdBMn-0xflWZGDwBoXRwi8"
          VITE_FIREBASE_AUTH_DOMAIN: "boekenbalie-5f0eb.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "boekenbalie-5f0eb"
          VITE_FIREBASE_STORAGE_BUCKET: "boekenbalie-5f0eb.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "408346652439"
          VITE_FIREBASE_APP_ID: "1:408346652439:web:2e6078034103246a041152"
      - name: GitHub Pages instellen
        uses: actions/configure-pages@v6
      - name: Gebouwde game uploaden
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v5
